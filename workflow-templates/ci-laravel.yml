# CI base de una app Laravel con frontend en Vite: estilo y tests.
# Parte del CI del starter kit de Laravel. Supone los scripts `format:check`
# en package.json y la base de tests en SQLite en memoria de phpunit.xml.
# Para otra base de datos, agrega un `services:` al job `tests`.

name: ci

on:
  push:
    branches: [$default-branch, develop]
  pull_request:
    branches: [$default-branch, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Dependencias
        run: |
          composer install --no-interaction --prefer-dist --no-progress --no-scripts
          npm ci

      - name: Pint
        run: vendor/bin/pint --test

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npx eslint .

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'
          cache: npm

      - name: Dependencias
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Assets
        run: npm run build

      - name: Tests
        run: php artisan test
